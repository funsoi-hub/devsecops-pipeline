# The pipeline audits itself: zizmor checks these workflows for GitHub Actions security issues
# (unpinned actions, template injection, excessive permissions, credential persistence).
name: lint-workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install zizmor && zizmor --offline --min-severity medium .github/workflows
